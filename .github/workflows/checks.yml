name: checks

on:
  push:
    branches: [main, minmax]
  pull_request:
    branches: [main, minmax]

permissions:
  contents: write

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format Lua sources
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: lua tests

      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lua tests
            git commit -m "Format CVIM Lua sources"
            git push
          fi

      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check lua tests

      - name: Install Neovim stable
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz \
            --output /tmp/neovim.tar.gz
          tar -xzf /tmp/neovim.tar.gz -C /tmp
          echo "/tmp/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify Neovim version
        run: nvim --version

      - name: Run headless regression checks
        run: |
          nvim --headless -u NONE \
            -c "lua local ok, err = pcall(dofile, 'tests/run.lua'); if not ok then print(err); vim.cmd('cquit 1') end" \
            -c "qa!"

      - name: Run isolated startup smoke test
        run: |
          nvim --headless -u NONE \
            -c "lua local ok, err = pcall(dofile, 'tests/startup.lua'); if not ok then print(err); vim.cmd('cquit 1') end" \
            -c "qa!"
