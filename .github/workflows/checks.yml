name: checks

on:
  push:
    branches: [main, minmax]
  pull_request:
    branches: [main, minmax]

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Neovim stable
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz \
            --output /tmp/neovim.tar.gz
          tar -xzf /tmp/neovim.tar.gz -C /tmp
          echo "/tmp/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify Neovim version
        run: nvim --version

      - name: Run headless regression checks
        run: |
          nvim --headless -u NONE \
            -c "lua local ok, err = pcall(dofile, 'tests/run.lua'); if not ok then print(err); vim.cmd('cquit 1') end" \
            -c "qa!"
